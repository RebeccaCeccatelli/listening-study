# Publishes the listening survey from music_EBT (demo/showcase/site/survey) to this repo's GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RebeccaCeccatelli/music_EBT
          path: music_EBT
          sparse-checkout: demo/showcase/site/survey
      - name: Stage site
        run: |
          mkdir -p _site
          cp root/index.html _site/
          cp -r music_EBT/demo/showcase/site/survey _site/survey
          ls _site/survey/audio/*.mp3 | sort | tail -n +243 | xargs rm   # DIAGNOSTIC: first half of the audio only
          echo "files: $(find _site -type f | wc -l)  size: $(du -sh _site | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
